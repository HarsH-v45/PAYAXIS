version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: payaxis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payaxis
      POSTGRES_USER: payaxis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payaxis_secret}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U payaxis -d payaxis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payaxis_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-redis_secret}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payaxis_api
    restart: unless-stopped
    command: node server.js
    ports: ["4000:4000"]
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - payslip_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payaxis_worker
    restart: unless-stopped
    command: node worker.js
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - payslip_storage:/app/storage
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payaxis_frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  payslip_storage:
